<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент для золотистого текста -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Белые снежинки -->
  <g fill="white" opacity="0.9">
    <!-- Снежинка 1 - слева -->
    <g transform="translate(15, 25)">
      <path d="M 0,-3 L 0.5,-1 L 3,-1 L 0.5,0 L 3,1 L 0.5,1 L 0,3 L -0.5,1 L -3,1 L -0.5,0 L -3,-1 L -0.5,-1 Z" />
      <line x1="0" y1="-3" x2="0" y2="3" stroke="white" stroke-width="0.8"/>
      <line x1="-3" y1="0" x2="3" y2="0" stroke="white" stroke-width="0.8"/>
    </g>
    
    <!-- Снежинка 2 - справа сверху -->
    <g transform="translate(290, 20)">
      <path d="M 0,-2.5 L 0.4,-0.8 L 2.5,-0.8 L 0.4,0 L 2.5,0.8 L 0.4,0.8 L 0,2.5 L -0.4,0.8 L -2.5,0.8 L -0.4,0 L -2.5,-0.8 L -0.4,-0.8 Z" />
      <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="white" stroke-width="0.7"/>
      <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="white" stroke-width="0.7"/>
    </g>
    
    <!-- Снежинка 3 - справа снизу -->
    <g transform="translate(300, 55)">
      <path d="M 0,-2 L 0.3,-0.7 L 2,-0.7 L 0.3,0 L 2,0.7 L 0.3,0.7 L 0,2 L -0.3,0.7 L -2,0.7 L -0.3,0 L -2,-0.7 L -0.3,-0.7 Z" />
      <line x1="0" y1="-2" x2="0" y2="2" stroke="white" stroke-width="0.6"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="white" stroke-width="0.6"/>
    </g>
    
    <!-- Снежинка 4 - слева снизу -->
    <g transform="translate(20, 60)">
      <path d="M 0,-2 L 0.3,-0.7 L 2,-0.7 L 0.3,0 L 2,0.7 L 0.3,0.7 L 0,2 L -0.3,0.7 L -2,0.7 L -0.3,0 L -2,-0.7 L -0.3,-0.7 Z" />
      <line x1="0" y1="-2" x2="0" y2="2" stroke="white" stroke-width="0.6"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="white" stroke-width="0.6"/>
    </g>
    
    <!-- Снежинка 5 - между текстом и краем -->
    <g transform="translate(250, 40)">
      <path d="M 0,-2.2 L 0.35,-0.75 L 2.2,-0.75 L 0.35,0 L 2.2,0.75 L 0.35,0.75 L 0,2.2 L -0.35,0.75 L -2.2,0.75 L -0.35,0 L -2.2,-0.75 L -0.35,-0.75 Z" />
      <line x1="0" y1="-2.2" x2="0" y2="2.2" stroke="white" stroke-width="0.65"/>
      <line x1="-2.2" y1="0" x2="2.2" y2="0" stroke="white" stroke-width="0.65"/>
    </g>
  </g>
  
  <!-- Основной текст "Happy New Year" - золотистый, крупнее -->
  <text x="35" y="38" 
        font-family="'Playfair Display', serif" 
        font-size="34" 
        font-weight="700" 
        fill="url(#goldGradient)"
        letter-spacing="1.5px">
    Happy New Year
  </text>
  
  <!-- Подпись "новогодние ai фотосессии" - белая -->
  <text x="35" y="58" 
        font-family="'Inter', sans-serif" 
        font-size="12" 
        font-weight="400" 
        fill="white"
        letter-spacing="0.5px">
    новогодние ai фотосессии
  </text>
</svg>

