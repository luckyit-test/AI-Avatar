<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент для текста -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fff9e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для звезды -->
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Снежинки на фоне -->
  <g opacity="0.3">
    <circle cx="20" cy="15" r="1.5" fill="white"/>
    <circle cx="260" cy="20" r="1.5" fill="white"/>
    <circle cx="15" cy="65" r="1.5" fill="white"/>
    <circle cx="265" cy="70" r="1.5" fill="white"/>
    <!-- Простые снежинки -->
    <g transform="translate(30, 25)">
      <line x1="0" y1="-2" x2="0" y2="2" stroke="white" stroke-width="0.5"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="white" stroke-width="0.5"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4" stroke="white" stroke-width="0.5"/>
      <line x1="-1.4" y1="1.4" x2="1.4" y2="-1.4" stroke="white" stroke-width="0.5"/>
    </g>
    <g transform="translate(250, 60)">
      <line x1="0" y1="-2" x2="0" y2="2" stroke="white" stroke-width="0.5"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="white" stroke-width="0.5"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4" stroke="white" stroke-width="0.5"/>
      <line x1="-1.4" y1="1.4" x2="1.4" y2="-1.4" stroke="white" stroke-width="0.5"/>
    </g>
  </g>
  
  <!-- Звезда слева -->
  <g transform="translate(10, 40)">
    <path d="M 0,-8 L 2,-2 L 8,-2 L 3,1 L 5,7 L 0,3 L -5,7 L -3,1 L -8,-2 L -2,-2 Z" 
          fill="url(#starGradient)" stroke="#ffd700" stroke-width="0.5"/>
  </g>
  
  <!-- Основной текст "Happy New Year" -->
  <text x="35" y="35" 
        font-family="'Playfair Display', serif" 
        font-size="28" 
        font-weight="700" 
        fill="url(#textGradient)"
        letter-spacing="1px">
    Happy New Year
  </text>
  
  <!-- Подпись "новогодние ai фотосессии" -->
  <text x="35" y="55" 
        font-family="'Inter', sans-serif" 
        font-size="11" 
        font-weight="400" 
        fill="rgba(255,255,255,0.85)"
        letter-spacing="0.5px">
    новогодние ai фотосессии
  </text>
  
  <!-- Новогодние шары справа -->
  <g transform="translate(240, 20)">
    <!-- Красный шар -->
    <circle cx="0" cy="0" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="0.5"/>
    <path d="M -2,-2 Q 0,-3 2,-2" stroke="#ffffff" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="-1" r="1" fill="#ffffff" opacity="0.6"/>
    
    <!-- Золотой шар -->
    <circle cx="0" cy="18" r="5" fill="#fbbf24" stroke="#ffffff" stroke-width="0.5"/>
    <path d="M -1.5,16 Q 0,15 1.5,16" stroke="#ffffff" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="17" r="0.8" fill="#ffffff" opacity="0.6"/>
    
    <!-- Синий шар -->
    <circle cx="0" cy="36" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="0.5"/>
    <path d="M -1.5,34 Q 0,33 1.5,34" stroke="#ffffff" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="35" r="0.8" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Искры вокруг шаров -->
  <g opacity="0.6">
    <circle cx="235" cy="18" r="1" fill="#ffd700"/>
    <circle cx="245" cy="25" r="0.8" fill="#ffd700"/>
    <circle cx="250" cy="15" r="0.8" fill="#ffd700"/>
    <circle cx="238" cy="40" r="0.8" fill="#60a5fa"/>
    <circle cx="248" cy="45" r="0.8" fill="#60a5fa"/>
  </g>
</svg>

